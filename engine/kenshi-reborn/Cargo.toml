[package]
name = "kenshi-reborn"
version = "0.1.0"
edition = "2024"
description = "KenshiReborn — sovereign game engine, forged by Gaia on RTX 5090"

[dependencies]
wgpu = { version = "24", features = ["wgsl"] }
